    properties:
      already_existed:
        type: boolean
      annotation_name_count:
        type: integer
      annotation_status:
        description: "AnnotationStatus reports what happened during the follow-on\nGNfinder
          + GNverifier pass that produces augmented JATS +\nTaxPub XML stored at <sha>.jats.xml.
          Values:\n\n\t\"annotated\"      — augmented XML generated and stored\n\t\"skipped\"
          \       — no TEI was available (upstream GROBID\n\t                   failed
          or was skipped for a non-PDF)\n\t\"already_exists\" — dedup hit and augmented
          XML was already on\n\t                   disk from a prior upload\n\t\"failed\"
          \        — annotation pass errored; upload still\n\t                   succeeded,
          curator can retry later\n\nAnnotationNameCount is the number of <tp:taxon-name>
          elements\nin the augmented XML (raw hit count from GNfinder; not de-\nduplicated).
          Present when status == \"annotated\" or\n\"already_exists\"."
        type: string
      attached_references:
        description: |-
          AttachedReferences lists reference rows that already have
          this sha attached via hive__reference_pdf. Populated when
          the sidecar dedupes so the WUI can offer to jump to an
          existing reference instead of walking the curator through
          a fresh bibliographic-entry flow they'd end up discarding.
        items:
          $ref: '#/definitions/server.apiAttachedReference'
        type: array
      doi:
        type: string
      ext:
        type: string
      matched_by_doi:
        description: |-
          MatchedByDOI lists reference rows whose col__doi matches
          the DOI extracted from this upload. Same-DOI-different-sha
          is the multi-format case: dropping the JATS for a paper
          whose PDF is already ingested. Clients (WUI upload dialog,
          hive ingest CLI) should offer to attach this sha to one of
          the matched references rather than mint a duplicate.
        items:
          $ref: '#/definitions/server.apiAttachedReference'
        type: array
      metadata:
        $ref: '#/definitions/server.apiUploadBibHeader'
      sha512:
        type: string
      size:
        type: integer
      tei_status:
        type: string
    type: object
