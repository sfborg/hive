swagger: "2.0"
tags:
- description: Health, archive metadata, keymap, shared vocabularies.
  name: system
- description: Read + write the taxon tree, ancestors, classifications, moves.
  name: taxa
- description: Scientific-name search, parse, patch, relations, dependencies.
  name: names
- description: Synonym add/move/delete, pro-parte relationships.
  name: synonyms
- description: Reference CRUD, DOI/OpenAlex/BHLnames/BibTeX lookup, PDF upload/library,
    JATS conversion, corrections.
  name: references
- description: Vernacular-name CRUD scoped to a taxon.
  name: vernaculars
- description: Geographic distribution CRUD scoped to a taxon.
  name: distributions
- description: Species-interaction CRUD (predator/host/pollinator/etc).
  name: species-interactions
- description: Type-material CRUD scoped to a name.
  name: type-materials
- description: Name-relation CRUD (original combination, homonym, etc).
  name: name-relations
- description: Role-scoped agent CRUD (creator/contact/editor/contributor/publisher).
  name: agents
- description: Archive-level metadata (title, description, license, logo).
  name: metadata
- description: Validation issues (soft warnings) and rule reindex.
  name: issues
- description: Controlled vocabularies (rank, code, status, NOMEN, countries, etc).
  name: vocab
- description: Provider management + prompt invocation for LLM-assisted extraction.
  name: llm
- description: Prompt library CRUD (system/user prompt templates for LLM runs).
  name: prompts
- description: Curator review of LLM-extracted assertions staged on references.
  name: assertions
- description: Gold-standard test-set membership for evaluation runs.
  name: test-set
- description: OpenAPI spec + RapiDoc viewer.
  name: docs
