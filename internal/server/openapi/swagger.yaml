        type: boolean
      id:
        type: string
      is_synonym:
        description: |-
          IsSynonym is set only when the search returned this row via a
          synonym pointing at the accepted taxon (id). Elided when false
          so responses from list endpoints (ListChildren, roots) stay
          identical to the pre-synonyms wire shape.
        type: boolean
      label:
        $ref: '#/definitions/server.apiLabel'
      matched_name:
        description: |-
          MatchedName carries the text that actually satisfied the query.
          Equals name for accepted-name matches; equals the synonym's
          canonical for synonym matches. Elided when unset (list
          endpoints leave it empty; front-ends fall back to name).
        type: string
      name:
        type: string
      name_id:
        type: string
      parent:
        allOf:
        - $ref: '#/definitions/server.apiRef'
        description: |-
          Parent carries the immediate parent taxon's id + rendered
          label (rank baked in via BuildLabel) so front-ends can
          disambiguate homonyms — two accepted taxa sharing a canonical
          — and give synonym rows a "you land under X" cue. Populated
          only by SearchTaxa; list endpoints (children, roots) leave it
          nil, which the JSON omitempty erases. Root-level taxa also
          leave it nil.
      parent_id:
        type: string
      rank:
        type: string
      status:
        type: string
    type: object
  server.apiTaxonPatch:
    properties:
      according_to_page:
        type: string
      according_to_page_link:
        type: string
      extinct:
        type: boolean
      link:
        type: string
      name_phrase:
        type: string
      remarks:
        type: string
      scrutinizer:
        type: string
      scrutinizer_date:
        type: string
      scrutinizer_id:
        type: string
    type: object
  server.apiTestSetAddRequest:
    properties:
      notes:
        type: string
    type: object
  server.apiTestSetList:
    properties:
      items:
        items:
          $ref: '#/definitions/server.apiTestSetMember'
        type: array
    type: object
  server.apiTestSetMember:
    properties:
      added_at:
        type: string
      added_by:
        type: string
      notes:
        type: string
      reference_id:
        type: string
    type: object
  server.apiTestSetStatus:
    properties:
      added_at:
        type: string
      added_by:
        type: string
      in_test_set:
        type: boolean
      notes:
        type: string
    type: object
  server.apiTypeMaterial:
    properties:
      altitude:
        type: integer
      associated_sequences:
        type: string
      catalog_number:
        type: string
      citation:
        type: string
      collector:
        type: string
      country:
        type: string
      date:
        type: string
      host:
        type: string
      id:
        type: string
      institution_code:
        type: string
      issue_count:
        description: |-
          IssueCount is the number of open validation issues currently
          filed against this type_material row. Zero → elided from JSON.
          Front-ends render a warn icon when > 0.
        type: integer
      latitude:
        type: number
      link:
        type: string
      locality:
        type: string
      longitude:
        type: number
      max_severity:
        description: |-
          MaxSeverity is the highest severity ("error" > "warn" > "info"
          > "debug") among the row's open issues. Empty → elided from
          JSON. Drives the badge color the WUI paints.
        type: string
      modified:
        type: string
      modified_by:
        type: string
      name_id:
        type: string
      reference_id:
        type: string
      remarks:
        type: string
      sex:
        type: string
      source_id:
        type: string
      specimen_id:
        type: string
      status:
        type: string
    type: object
  server.apiTypeMaterialPatch:
    properties:
      altitude:
        type: integer
      associated_sequences:
        type: string
      catalog_number:
        type: string
      citation:
        type: string
      collector:
        type: string
      country:
        type: string
      date:
        type: string
      host:
        type: string
      institution_code:
        type: string
      latitude:
        type: number
      link:
        type: string
      locality:
        type: string
      longitude:
        type: number
      reference_id:
        type: string
      remarks:
        type: string
      sex:
        type: string
