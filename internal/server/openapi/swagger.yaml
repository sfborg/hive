  server.apiVernacular:
    properties:
      area:
        type: string
      country:
        type: string
      id:
        type: string
      issue_count:
        description: |-
          IssueCount is the number of open validation issues currently
          filed against this vernacular row (table_name='vernacular',
          not-yet-acknowledged). Zero → elided from JSON. Front-ends
          render a warn icon on the row when > 0.
        type: integer
      language:
        type: string
      max_severity:
        description: |-
          MaxSeverity is the highest severity present among the row's
          open issues ("error", "warn", "info", "debug"). Empty when
          IssueCount is 0; elided from JSON in that case. Drives the
          badge color the WUI paints on the row.
        type: string
      modified:
        type: string
      modified_by:
        type: string
      name:
        type: string
      preferred:
        type: boolean
      reference_id:
        type: string
      remarks:
        type: string
      sex:
        type: string
      source_id:
        type: string
      taxon_id:
        type: string
      transliteration:
        type: string
    type: object
  server.apiVernacularPatch:
    properties:
      area:
        type: string
      country:
        type: string
      language:
        type: string
      name:
        type: string
      preferred:
        type: boolean
      reference_id:
        type: string
      remarks:
        type: string
      sex:
        type: string
      source_id:
        type: string
