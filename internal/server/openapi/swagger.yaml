      basionym_authorship_year:
        type: string
      basionym_ex_authorship:
        type: string
      code:
        type: string
      combination_authorship:
        description: |-
          Atomized authorship — the CoLDP split of the raw Authorship
          string. See apiName's field-level comments for the code-specific
          semantics; both pointers accept empty-string to clear the slot.
        type: string
      combination_authorship_year:
        type: string
      combination_ex_authorship:
        type: string
      cultivar_epithet:
        type: string
      etymology:
        type: string
      gender:
        type: string
      genus:
        type: string
      infrageneric_epithet:
        type: string
      infraspecific_epithet:
        type: string
      link:
        type: string
      notho:
        type: string
      published_in_page:
        type: string
      published_in_page_link:
        type: string
      published_in_year:
        type: string
      rank:
        description: |-
          Rank / Code / Status / Gender are typed enums; they arrive as raw
          enum-ID strings (RANK_KEY, ZOOLOGICAL, ACCEPTED, MASCULINE, …).
        type: string
      reference_id:
        description: |-
          ReferenceID is the "published in" reference ID (v1: single value
          stored into sfga's comma-separated col__reference_id). Sending
          "" clears the link.
        type: string
      remarks:
        type: string
      scientific_name:
        type: string
      scientific_name_string:
        type: string
      specific_epithet:
        type: string
      status:
        type: string
      uninomial:
        description: Structural pieces the curator edits.
        type: string
    type: object
  server.apiNameRelation:
    properties:
      direction:
        type: string
      id:
        type: string
