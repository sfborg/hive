  server.apiLLMInvokeRequest:
    properties:
      effort:
        description: |-
          Effort is the reasoning effort level (low | medium | high |
          xhigh | max). Empty uses the model default. Sent only to
          Anthropic providers.
        type: string
      input:
        type: string
      max_tokens:
        type: integer
      model:
        type: string
      notes:
        type: string
      parent_run_id:
        description: compose→NER link
        type: string
      prompt:
        type: string
      provider:
        type: string
      purpose:
        description: '"ner" | "compose" | "translate"'
        type: string
      reference_id:
        description: which paper this run is for
        type: string
      response_format:
        type: string
      temperature:
        type: number
      thinking_summary:
        description: |-
          ThinkingSummary requests a summary of the model's reasoning,
          stored on the run's envelope. Anthropic models that think by
          default only; others are rejected with 400.
        type: boolean
    type: object
  server.apiLLMInvokeResponse:
    properties:
      assertions_materialized:
        type: integer
      envelope:
        type: object
      materialize_error:
        type: string
      persist_error:
        type: string
      run_id:
        type: string
    type: object
  server.apiLLMModelList:
    properties:
      items:
        items:
          type: object
        type: array
      pricing_source:
        description: |-
          PricingSource names where any listed_price values came from
          (the provider's API host), so the WUI can attribute them.
          Empty when no model in the list carries a listed price.
        type: string
    type: object
  server.apiLLMPipelineRequest:
    properties:
      compose_prompt_id:
        type: string
      ner_effort:
        description: |-
          Per-step reasoning effort (low | medium | high | xhigh | max).
          Empty uses the model default. Sent only to Anthropic
          providers. Separate per step because NER typically needs less
          reasoning than tree composition.
        type: string
      ner_max_tokens:
        description: |-
          Per-step max_tokens overrides. Compose typically needs more
          output budget (whole-tree JSON) than NER (assertion array).
        type: integer
      ner_model:
        type: string
      ner_prompt_id:
        description: |-
          NERPromptID and ComposePromptID select which prompt to send
          to each stage. Value is either a shipped built-in name
          ("ner_v6") or a curator fork's UUID. Empty falls back to
          the current shipped default (defaultNERPromptID /
          defaultComposePromptID). Resolves through the curator DB
          first, then the built-in library.
        type: string
      ner_provider:
        description: |-
          NERProvider names the registered provider for the NER pass.
          Required. NERModel optionally overrides the provider's
          configured DefaultModel for this run.
        type: string
      notes:
        description: Notes annotates both runs. Curator-facing free text.
        type: string
      reference_id:
        description: |-
          ReferenceID is which paper the pipeline runs against. Required —
          the handler looks up the attached PDF sha and reads the JATS
          body from the sidecar. Papers without an attached PDF are
          rejected with a helpful message.
        type: string
      temperature:
        description: |-
          Temperature applied uniformly to both steps. Zero-value =
          provider default (usually deterministic-ish).
        type: number
      thinking_summary:
        description: |-
          ThinkingSummary requests a summary of the model's reasoning,
          stored on each run's envelope. Applied per step only where it
          adds no cost: Anthropic providers with a model that thinks by
          default. Other steps run without it.
        type: boolean
      tree_effort:
        type: string
      tree_max_tokens:
        type: integer
      tree_model:
        type: string
      tree_provider:
        description: |-
          TreeProvider names the registered provider for the compose
          (tree assembly) pass. Required. TreeModel optionally
          overrides the provider's configured DefaultModel.
        type: string
    type: object
  server.apiLLMPipelineResponse:
    properties:
      assertions_materialized:
        description: |-
          AssertionsMaterialized is how many hive__reference_assertion
          rows the NER step produced after parsing its output. Zero
          with a non-empty NERMaterializeError means the NER output
          was malformed (typically truncated at max_tokens).
        type: integer
      compose_run:
        $ref: '#/definitions/server.apiLLMRun'
      error:
        type: string
      failed_stage:
        description: |-
          FailedStage is "ner" | "compose" | "" (empty on full
          success). Lets the WUI show a targeted error UI instead of
          having to reason about which step's error message applies.
        type: string
      ner_materialize_error:
        type: string
      ner_run:
        $ref: '#/definitions/server.apiLLMRun'
      tree:
        type: object
    type: object
