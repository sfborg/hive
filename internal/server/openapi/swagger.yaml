  server.apiVocabTermDetail:
    properties:
      description:
        type: string
      id:
        type: string
      inverse:
        type: string
      name:
        type: string
      obo:
        description: |-
          Obo carries an ontology URI (e.g. RO PURL). Column name
          preserved from sfga's col__obo for lossless round-trip even
          when the value isn't OBO-namespaced.
        type: string
      super_types:
        description: |-
          SuperTypes is a comma-separated list of parent term ids —
          sfga's col__superTypes shape.
        type: string
      symmetrical:
        type: boolean
    type: object
  server.composeTreeExportEnvelope:
    properties:
      created_at:
        type: string
      notes:
        type: string
      purpose:
        type: string
      raw_output:
        type: object
      reference_id:
        type: string
      run_id:
        type: string
      source_id:
        type: string
      source_kind:
        type: string
    type: object
  server.createTaxonBody:
    properties:
      authorship:
        type: string
      basionym:
        $ref: '#/definitions/server.createTaxonBody'
      basionym_authorship:
        type: string
      basionym_authorship_year:
        type: string
      basionym_ex_authorship:
        type: string
      basionym_name_id:
        description: |-
          Optional basionym link — set exactly ONE of the following to
          link this new name to its original combination in the same
          atomic transaction as the primary create. See CLAUDE.md
          § Combination bracketing rules.

            BasionymNameID — id of an existing name row already in the
              archive. Handler links a BASIONYM name_relation from the
              primary name to this id.

            Basionym       — nested createTaxonBody-shaped payload for a
              brand-new original-combination name. Handler CreateNames
              it first, then uses the resulting id as the BASIONYM link
              target.

          Setting both is a 400 (ambiguous intent). Setting neither
          preserves today's behavior (no basionym link — the primary
          name is either an original combination or a curator-added-later-
          basionym recomb).
        type: string
      code:
        type: string
      combination_authorship:
        type: string
      combination_authorship_year:
        type: string
      combination_ex_authorship:
        type: string
      cultivar_epithet:
        type: string
      etymology:
        type: string
      gender:
        type: string
      genus:
        type: string
      infrageneric_epithet:
        type: string
      infraspecific_epithet:
        type: string
      link:
        type: string
      name_phrase:
        type: string
      notho:
        type: string
      parent_id:
        description: Taxon aggregate.
        type: string
      published_in_page:
        type: string
      published_in_page_link:
        type: string
      published_in_year:
        type: string
      rank:
        type: string
      reference_id:
        type: string
      remarks:
        type: string
      scientific_name:
        description: Name aggregate (verbatim + code required; rest optional).
        type: string
      scientific_name_string:
        type: string
      specific_epithet:
        type: string
      status:
        type: string
      synonym_status:
        description: |-
          SynonymStatus is applied by handleAddSynonym only — the
          taxonomic_status of the synonym-link row (SYNONYM,
          AMBIGUOUS_SYNONYM, MISAPPLIED). Ignored by other endpoints
          (handleCreateTaxon / handleAddBasionym). Empty defaults to
          SYNONYM inside AddSynonym.
        type: string
      uninomial:
        type: string
    type: object
  server.problem:
    properties:
      detail:
        type: string
      errors:
        items:
          $ref: '#/definitions/server.problemField'
        type: array
      instance:
        type: string
      status:
        type: integer
      title:
        type: string
      type:
        type: string
    type: object
  server.problemField:
    properties:
      field:
        type: string
      reason:
        type: string
    type: object
host: localhost:2365
info:
  contact:
    name: hive maintainers
    url: https://github.com/sfborg/hive
  description: |-
    REST API for the hive taxonomic editor. Reads and writes
    an sfga SQLite archive of taxonomic names, references,
    and supporting data. Regenerate this spec with `just openapi`.
  license:
    name: MIT
    url: https://github.com/sfborg/hive/blob/main/LICENSE
  termsOfService: https://github.com/sfborg/hive
  title: hive API
  version: "0.1"
paths:
  /agent/{role}:
    get:
      description: Every agent row scoped to one role table (creator | contact | editor
        | contributor | publisher). Sorted by family, given, id.
      parameters:
      - description: Role table (creator|contact|editor|contributor|publisher)
        in: path
        name: role
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.apiAgentList'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.problem'
      summary: List agents for a role
      tags:
      - agents
    post:
      consumes:
      - application/json
      description: Insert a new agent row scoped to the URL role. Any body role field
        is overridden by the path parameter.
      parameters:
      - description: Role table
        in: path
        name: role
        required: true
        type: string
      - description: Agent body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/server.apiAgent'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/server.apiAgent'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.problem'
      summary: Create an agent
      tags:
      - agents
  /agent/{role}/{id}:
    delete:
      description: Remove an agent row.
      parameters:
      - description: Role table
        in: path
        name: role
        required: true
        type: string
      - description: Agent ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.problem'
      summary: Delete an agent
      tags:
      - agents
    get:
      description: Return a single agent row by (role, id).
      parameters:
      - description: Role table
        in: path
        name: role
        required: true
        type: string
      - description: Agent ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.apiAgent'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.problem'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/server.problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.problem'
      summary: Get an agent
      tags:
      - agents
    patch:
      consumes:
      - application/json
      description: Partial update to an agent row. Pointer-optional fields distinguish
        leave-alone vs clear.
      parameters:
      - description: Role table
        in: path
        name: role
        required: true
        type: string
      - description: Agent ID
        in: path
        name: id
        required: true
        type: integer
      - description: Agent patch
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/server.apiAgentPatch'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.apiAgent'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.problem'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/server.problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.problem'
      summary: Patch an agent
      tags:
      - agents
  /agent/{role}/{id}/copy:
    post:
      consumes:
      - application/json
      description: Create a new agent in the target role from the source (URL role
        + id). Note field is blanked by default (role-specific); pass blank_note=false
        to preserve.
      parameters:
      - description: Source role
        in: path
        name: role
        required: true
        type: string
      - description: Source agent ID
        in: path
        name: id
        required: true
        type: integer
      - description: Copy request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/server.apiCopyAgentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/server.apiAgent'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.problem'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/server.problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.problem'
      summary: Copy an agent to another role
      tags:
      - agents
  /agent/{role}/{id}/move:
    post:
      consumes:
      - application/json
      description: Atomically reassign an agent to a different role (create target
        + delete source in one tx).
      parameters:
      - description: Source role
        in: path
        name: role
        required: true
        type: string
      - description: Source agent ID
        in: path
        name: id
        required: true
        type: integer
      - description: Move request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/server.apiCopyAgentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/server.apiAgent'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.problem'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/server.problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.problem'
      summary: Move an agent to another role
      tags:
      - agents
  /archive:
    get:
      description: Report the archive path, schema version, and read-only mode.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.apiArchive'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.problem'
      summary: Archive identity
      tags:
      - system
  /archive/assembler-nodes:
    get:
      description: |-
        Returns every Layer 2 taxon projected to
        {taxon_id, canonical, authorship, rank,
        parent_taxon_id, color, has_overlay, flags[]}.
        Color derivation: blue > red > amber > green.
        Consumed by the assimilate view for the four-color
        tree.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/server.apiAssemblerNode'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.problem'
      summary: List Layer 2 taxa with per-node color state
      tags:
      - archive
  /archive/reassemble:
    post:
      description: |-
        Runs the deterministic assembler across every
        compose run in the archive. Materializes matched /
        created taxa, synonyms, [bracket]ed species, and
        sensu-derived concept relations. Returns per-paper
        and per-action counters plus any curator-actionable
        flags.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.apiReassembleReport'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.problem'
      summary: Reassemble literature view from Layer 1 assertions
      tags:
      - archive
  /assertion/{id}/correction:
    post:
      consumes:
      - application/json
      description: Record a curator's fix to one NER-extracted field. The correction
        is additive; the original NER value stays on the assertion for training pipelines.
        Flips the assertion status to 'edited'.
      parameters:
      - description: Assertion ID
        in: path
        name: id
        required: true
        type: string
      - description: Correction body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/server.apiAssertionCorrectionPost'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.apiAssertion'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.problem'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/server.problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.problem'
      summary: Create an assertion-edit correction
      tags:
      - assertions
  /assertion/{id}/status:
    patch:
      consumes:
      - application/json
      description: Flip an assertion's review status (pending/accepted/rejected/edited).
        reject_reason required when status is 'rejected'.
      parameters:
      - description: Assertion ID
        in: path
        name: id
        required: true
        type: string
      - description: Status patch
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/server.apiAssertionStatusPatch'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.apiAssertion'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.problem'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/server.problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.problem'
      summary: Patch assertion status
      tags:
      - assertions
  /distribution/{id}:
    delete:
      description: Delete a distribution row by rowid.
      parameters:
      - description: Distribution rowid
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.problem'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/server.problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.problem'
      summary: Delete distribution
      tags:
      - distributions
    patch:
      consumes:
      - application/json
      description: Partially update a distribution row. TaxonID is not editable.
      parameters:
      - description: Distribution rowid
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/server.apiDistributionPatch'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.apiDistribution'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.problem'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/server.problem'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/server.problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.problem'
      summary: Update distribution
      tags:
      - distributions
  /health:
    get:
      description: Static 200 response for orchestrator health checks.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Liveness probe
      tags:
      - system
  /issue:
    get:
      description: Paginated list of validation issues matching the given filters.
      parameters:
      - description: Filter by table_name
        in: query
        name: table
        type: string
      - description: Filter by record id
        in: query
        name: record_id
        type: string
      - description: Filter by rule id
        in: query
        name: rule_id
        type: string
      - collectionFormat: csv
        description: 'Filter by severity (repeatable: error|warn|info|debug)'
        in: query
        items:
          type: string
        name: severity
        type: array
      - description: Hide acknowledged issues
        in: query
        name: hide_acknowledged
        type: boolean
      - description: Page size
        in: query
        name: limit
        type: integer
      - description: Pagination cursor
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.apiPage-server_apiIssue'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.problem'
      summary: List validation issues
      tags:
      - issues
  /issue/summary:
    get:
      description: Per-rule / per-severity counts across the archive.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.apiIssueSummary'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.problem'
      summary: Issue counts summary
      tags:
      - issues
  /keymap:
    get:
      description: Canonical shortcut list shared between TUI and WUI. Cached for
        one hour.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
