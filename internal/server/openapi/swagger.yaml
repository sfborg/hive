  /reference/search:
    get:
      description: Case-insensitive substring search across author, title, citation,
        and DOI; queries of 8+ characters also match an ID prefix.
      parameters:
      - description: Query string
        in: query
        name: q
        required: true
        type: string
      - description: Page size
        in: query
        name: limit
        type: integer
      - description: 'Comma-separated workflow filters, all of which must hold: runs,
          assertions, pending, bibliographic, digitized, imported, and no-bibliographic,
          no-digitized, no-assertions, no-imported'
        in: query
        name: filter
        type: string
      - description: Papers mentioning names the Catalogue of Life places in this
          higher taxon
        in: query
        name: col_parent
        type: string
      - description: Papers mentioning names NCBI Taxonomy places in this higher taxon
        in: query
        name: ncbi_parent
        type: string
      - description: Count only names mentioned at least this many times toward col_parent
          / ncbi_parent
        in: query
        name: min_mentions
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.apiPage-server_apiReferenceHit'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.problem'
      summary: Search references
      tags:
      - references
