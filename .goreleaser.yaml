# Release builds for hive. `just release-snapshot` builds locally without
# publishing; pushing a vX.Y.Z tag runs .github/workflows/release.yml.
version: 2

project_name: hive

before:
  hooks:
    - go run ./tools/mknotices -o THIRD_PARTY_NOTICES.txt

builds:
  - id: hive
    main: .
    binary: hive
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/sfborg/hive/pkg.Version=v{{ .Version }}
      - -X github.com/sfborg/hive/pkg.Build={{ .ShortCommit }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: hive
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - THIRD_PARTY_NOTICES.txt

checksum:
  name_template: checksums.txt

changelog:
  disable: true

release:
  github:
    owner: sfborg
    name: hive
  draft: true
